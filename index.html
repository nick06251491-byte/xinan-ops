<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>新安汽車 整備進度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0c;--card:#191714;--line:#2c2820;--fg:#f1ece2;--mute:#9a9283;--gold:#c9a24a;--todo:#26231d;--doing:#c9a24a;--doing-fg:#1b1405;--done:#3f8f6b;--done-fg:#fff}
*{box-sizing:border-box}
html{overflow-anchor:none}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Noto Sans TC",-apple-system,"PingFang TC",sans-serif;padding-block:0 56px}
header{border-bottom:1px solid var(--gold);padding:14px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.wrap{max-width:900px;margin:0 auto}
.brand{font-family:"Noto Serif TC",serif;color:var(--gold);font-size:20px;font-weight:700;line-height:1.1}
.brand small{display:block;font:500 11px "Noto Sans TC",sans-serif;color:var(--mute);letter-spacing:.08em;margin-top:2px}
main{padding:20px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
h1{font-family:"Noto Serif TC",serif;font-size:30px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 18px;font-size:13.5px}
.stats{display:flex;gap:22px;margin-bottom:18px;flex-wrap:wrap}
.stats b{display:block;font:700 26px "Noto Serif TC",serif;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12px;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{font:inherit;font-size:13.5px;background:var(--todo);color:var(--fg);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.filters button.on{background:var(--gold);color:var(--doing-fg);font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.car{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.car-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.car-h h2{margin:0;font-family:"Noto Serif TC",serif;font-size:19px;overflow-wrap:anywhere}
.badge{font-size:12px;white-space:nowrap;padding:2px 9px;border-radius:999px;background:var(--todo);color:var(--mute);font-variant-numeric:tabular-nums}
.badge.all{background:var(--done);color:var(--done-fg)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:520px){.steps{grid-template-columns:repeat(7,1fr)}}
.st{text-align:center;border-radius:8px;padding:8px 2px;background:var(--todo);color:var(--mute);font-size:14px;line-height:1.25}
.st small{display:block;font-size:11px;opacity:.9}
.st.s1{background:var(--doing);color:var(--doing-fg)}
.st.s2{background:var(--done);color:var(--done-fg)}
.st{border:0;font-family:inherit;cursor:pointer;width:100%}
.st:active{transform:scale(.97)}
.who{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap;font-size:13.5px;color:var(--mute)}
.who select,.who input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:150px}
.add{display:flex;gap:6px}
.car-h .l{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--todo);color:var(--gold);font:700 20px "Noto Serif TC",serif;display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.add .cam{background:var(--todo);color:var(--fg)}
.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.gal button{flex:none;width:76px;height:76px;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--todo);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.galh{font-size:12px;color:var(--mute);margin:0}
.pv{height:64px;width:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pvs{display:flex;gap:8px;flex-wrap:wrap}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:50;padding:16px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}
#lb p{margin:0;color:var(--fg);font-size:14px;text-align:center}
.newbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.newbox[hidden]{display:none}
.newbox input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.newrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newrow button{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--todo);color:var(--fg)}
.newrow button.go{background:var(--gold);color:var(--doing-fg);font-weight:700}
.addbtn{font:inherit;background:var(--gold);color:var(--doing-fg);font-weight:700;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.st.pend{outline:2px dashed var(--gold);outline-offset:1px}
.confirm{border:1px solid var(--gold);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#211c10}
.cmsg{font-size:13.5px;overflow-wrap:anywhere}
.crow{display:flex;gap:8px}
.crow button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;flex:1}
.cok{background:var(--gold);color:var(--doing-fg);font-weight:700}
.cno{background:var(--todo);color:var(--fg)}
.cok:disabled{opacity:.6}
.add input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.add button{font:inherit;background:var(--todo);color:var(--fg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.add button.go{background:var(--gold);color:var(--doing-fg);font-weight:700}
.who select.need{border-color:var(--gold)}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px}
.price{font:700 20px "Noto Serif TC",serif;color:var(--gold)}
.price small{font:400 12px "Noto Sans TC",sans-serif;color:var(--mute);margin-left:3px}
.note{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:8px;padding:8px 10px}
.log{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.log b{color:var(--fg);font-weight:500}
.empty{color:var(--mute);text-align:center;padding:40px 0}
footer{margin-top:28px;font-size:12px;color:var(--mute)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">新安汽車<small>整備進度</small></div></div></header>
<main><div class="wrap">
  <h1>每台車整備到哪裡</h1>
  <p class="sub">順序：過戶、認證、修理、洗車、拍照、定價、安檢。點格子切換狀態：未做、進行中、完成，大家的畫面會同步。LINE 群組的進度也會同步進來。</p>
  <label class="who">我是<select id="me"><option value="">請選擇</option><option value="傑哥">傑哥</option><option value="阿輝">阿輝</option><option value="阿軒">阿軒</option><option value="祐齊">祐齊</option><option value="阿瑋">阿瑋</option><option value="nick">nick</option></select></label>
  <div class="stats">
    <div><b id="n-all">0</b><span>整備中</span></div>
    <div><b id="n-done">0</b><span>全部完成</span></div>
  </div>
  <div class="filters" style="margin-bottom:10px"><button class="addbtn" id="addbtn" type="button">＋ 新增車輛</button></div>
  <div class="newbox" id="newbox" hidden>
    <input type="text" id="nname" maxlength="30" placeholder="車款（例：賓士 350D）">
    <div class="newrow"><button type="button" id="npick">選頭貼照片</button><img class="pv" id="npv" alt="" hidden><span class="hint" id="nhint" style="font-size:12px;color:var(--mute)">頭貼照片（選填，可日後再補）</span></div>
    <div class="newrow"><button type="button" class="go" id="nok">確認新增</button><button type="button" id="ncancel">取消</button></div>
  </div>
  <div class="filters" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="doing">整備中</button>
    <button data-f="done">已完成</button>
    <button data-f="insp">安檢區</button>
  </div>
  <div class="filters" id="ofilters" style="margin-bottom:8px"></div>
  <div class="filters" id="bfilters" style="margin-bottom:8px"></div>
  <div class="filters" id="sfilters"></div>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div></main>
<input type="file" id="avIn" accept="image/*" hidden>
<input type="file" id="phIn" accept="image/*" hidden>
<input type="file" id="nIn" accept="image/*" hidden>
<div id="lb" role="dialog" aria-label="照片"><img alt=""><p></p></div>
<script>
const BASE="https://aaltpysmoejezdwzhmur.supabase.co",SB=BASE+"/rest/v1",KEY="sb_publishable_VKq846Cfaik7DZSwZOJ2sw_sfZZU3WS";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const STEPS=[["t","過戶"],["c","認證"],["r","修理"],["w","洗車"],["p","拍照"],["g","定價"],["s","安檢"]];
const LBL=["未做","進行中","完成"];
const BRANDS=[["賓士",/賓士|benz|\bgl[abcesk]\b|\bgl[abcesk]\d|\b[abcegs]\d{3}|\bgle|\bglc/i,1],["BMW",/bmw|寶馬|\b[1-8]\d{2}[a-z]?\b(?=.*(柴油|汽油|2\.0|3\.0))|\b[1-8]\d{2}d\b|\bx[1-7]\b/i,1],["富豪",/volvo|富豪|\bxc\d{2}|\bv\d{2}\b|\bs\d{2}\b/i,1],["Audi",/audi|奧迪|\ba[1-8]\b|\bq[2-8]\b/i,1],["VW",/\bvw\b|volkswagen|福斯|golf|tiguan|passat|polo/i,1],["Lexus",/lexus|凌志|\b[ni]x\b|\bes\d{3}|\brx\d{3}/i,1],["Porsche",/porsche|保時捷|cayenne|macan/i,1],["Mini",/mini/i,1],["Ford",/ford|福特|kuga|focus|fiesta|mondeo|ecosport/i,1],["Mazda",/mazda|馬自達|\bcx-?\d/i,1],["Hyundai",/hyundai|現代|tucson|santa|elantra/i,1],["Kia",/\bkia\b|起亞|sportage|sorento|stonic/i,1],["Subaru",/subaru|速霸陸|forester|xv\b|outback/i,1],["Suzuki",/suzuki|鈴木|swift|jimny/i,1],["Toyota",/toyota|豐田|altis|yaris|rav4|camry|corolla|vios|wish|cross|sienta|prius/i,0],["Honda",/honda|本田|cr-?v|civic|accord|hr-?v|fit\b|odyssey|k14/i,0],["Nissan",/nissan|日產|裕隆|sentra|tiida|kicks|livina|march|x-?trail/i,0],["Mitsubishi",/mitsubishi|三菱|outlander|colt|delica|zinger/i,0],["Luxgen",/luxgen|納智捷|\bu[67]\b|\bs3\b/i,0]];
function brandOf(c){if(c.origin&&c.brand)return{b:c.brand,o:c.origin,s:c.series||""};const n=c.name||"";for(const b of BRANDS)if(b[1].test(n))return{b:b[0],o:/國產/.test(n)?"國產":/進口/.test(n)?"進口":(b[2]?"進口":"國產"),s:c.series||""};return{b:"其他",o:/國產/.test(n)?"國產":"進口",s:c.series||""}}
const SERIES=["轎車","掀背","旅行","休旅"];
let ord={},lastSig="",ofil="全部",bfil="全部",sfil="全部";
let cars=[],logs={},filter="all",busy=false,pend={},sending=false,newPhoto=null,target=null;
const $=id=>document.getElementById(id);
function fmt(s){const d=new Date(s);if(isNaN(d))return"";return(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function doneCount(c){return STEPS.filter(([k])=>(c.steps||{})[k]===2).length}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
try{$("me").value=localStorage.getItem("xo_me")||""}catch(e){}
$("me").addEventListener("input",()=>{try{localStorage.setItem("xo_me",$("me").value.trim())}catch(e){}$("me").classList.remove("need")});
function needMe(){const me=$("me").value.trim();if(!me){$("me").classList.add("need");$("me").focus();return null}return me}
/* photos */
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height)),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    cv.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(),"image/jpeg",.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function upload(p){const name=Date.now().toString(36)+Math.random().toString(36).slice(2,8)+".jpg";
  const r=await fetch(BASE+"/storage/v1/object/car-photos/"+name,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"image/jpeg"},body:p.blob});
  if(!r.ok)throw 0;return BASE+"/storage/v1/object/public/car-photos/"+name}
function openLb(src,cap){const lb=$("lb");lb.querySelector("img").src=src;lb.querySelector("p").textContent=cap||"";lb.classList.add("on")}
$("lb").addEventListener("click",()=>$("lb").classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").classList.remove("on")});
/* render */
function render(){
  const keep={};document.querySelectorAll(".add").forEach(f=>{const v=f.querySelector("input").value;if(v)keep[f.dataset.id]=v});
  const active=document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".add");const activeId=active&&active.dataset.id;
  if(!Object.keys(ord).length)cars.slice().sort((a,b)=>(b.updated_at||"").localeCompare(a.updated_at||"")).forEach((c,i)=>ord[c.id]=i);
  const sorted=cars.slice().sort((a,b)=>(ord[a.id]??-1)-(ord[b.id]??-1));
  const sy=window.scrollY;
  const done=sorted.filter(c=>doneCount(c)===STEPS.length).length;
  $("n-all").textContent=sorted.length-done;$("n-done").textContent=done;
  const insp=filter==="insp",isDone=c=>((c.steps||{}).s||0)===2;
  const list=sorted.filter(c=>{const bo=brandOf(c);
    if(ofil!=="全部"&&bo.o!==ofil)return false;if(bfil!=="全部"&&bo.b!==bfil)return false;if(sfil!=="全部"&&bo.s!==sfil)return false;
    if(insp)return isDone(c);
    return filter==="all"||(filter==="done"?doneCount(c)===STEPS.length:doneCount(c)<STEPS.length)});
  const chips=(id,key,cur,vals,lab)=>{const box=$(id);box.replaceChildren();for(const v of vals){const b=el("button",cur===v?"on":"",lab(v));b.dataset.k=key;b.dataset.v=v;box.append(b)}};
  const idn=sorted.map(brandOf);
  chips("ofilters","o",ofil,["全部","國產","進口"],v=>v==="全部"?"全部產地":v);
  const bc={};if(ofil!=="全部")idn.forEach(x=>{if((ofil==="全部"||x.o===ofil)&&x.b)bc[x.b]=(bc[x.b]||0)+1});
  if(bfil!=="全部"&&!(bfil in bc))bfil="全部";
  chips("bfilters","b",bfil,["全部",...Object.keys(bc).sort((x,y)=>bc[y]-bc[x]||x.localeCompare(y))],v=>v==="全部"?"全部品牌":v+" "+bc[v]);
  chips("sfilters","s",sfil,["全部",...SERIES],v=>v);
  const g=$("grid");g.style.minHeight=g.offsetHeight+"px";g.replaceChildren();
  if(!list.length)g.append(el("div","empty","目前沒有符合的車輛"));
  for(const c of list){
    const n=doneCount(c),card=el("div","car"),P=pend[c.id]||{};
    const h=el("div","car-h"),l=el("div","l");
    const av=el("button","av");av.type="button";av.dataset.id=c.id;av.dataset.a="av";av.setAttribute("aria-label",c.name+" 更換頭貼");
    const src=P.avatar?P.avatar.url:c.photo;
    if(src){const im=el("img");im.src=src;im.alt="";av.append(im)}else av.textContent=(c.name||"?").slice(0,1);
    {const bo=brandOf(c);l.append(av,el("h2","",c.name||"未命名"));l.append(el("span","tag",bo.o+"・"+bo.b+(bo.s?"・"+bo.s:"")))}
    h.append(l,el("span","badge"+(n===STEPS.length?" all":""),n+"/"+STEPS.length));
    const st=el("div","steps");
    for(const[k,name]of STEPS){const has=P.steps&&k in P.steps;const v=has?P.steps[k]:((c.steps||{})[k]||0);const b=el("button","st s"+v+(has?" pend":""),name);b.type="button";b.dataset.id=c.id;b.dataset.k=k;b.setAttribute("aria-label",c.name+" "+name+" "+LBL[v]+(has?"（待確認）":""));b.append(el("small","",has?LBL[v]+"?":LBL[v]));st.append(b)}
    card.append(h,st);
    if(c.price!=null&&c.price!=="")card.append(el("div","price",c.price+" 萬"));
    if(c.note)card.append(el("div","note",c.note));
    const L=logs[c.id]||[];
    const ph=L.filter(x=>x.photo).slice(0,12);
    if(ph.length){card.append(el("p","galh","拍照回報（點開看大圖）"));const gl=el("div","gal");
      for(const x of ph){const b=el("button");b.type="button";b.dataset.a="lb";b.dataset.src=x.photo;b.dataset.cap=fmt(x.at)+" "+(x.who||"")+" "+(x.text||"");b.setAttribute("aria-label","看照片 "+b.dataset.cap);const im=el("img");im.src=x.photo;im.loading="lazy";im.alt="";b.append(im);gl.append(b)}
      card.append(gl)}
    const ad=el("form","add");ad.dataset.id=c.id;const ai=el("input");ai.type="text";ai.placeholder="補充備註（例：冷氣要換、等零件）";ai.maxLength=120;ai.setAttribute("aria-label","補充備註");

      if(P.photo||P.avatar){const pv=el("div","pvs");for(const x of[P.avatar,P.photo])if(x){const im=el("img","pv");im.src=x.url;im.alt="";pv.append(im)}bar.append(pv)}
      const row=el("div","crow");
      const ok=el("button","cok","確認更新");ok.type="button";ok.dataset.a="ok";
      const no=el("button","cno","取消");no.type="button";no.dataset.a="no";
      row.append(ok,no);bar.append(row);card.append(bar)}
    if(L.length){const ul=el("ul","log");
      for(const x of L.slice(0,4)){const li=el("li");li.append(fmt(x.at)+"　");if(x.src==="LINE")li.append(el("span","tag","LINE"));li.append(el("b","",x.who||""),"　"+(x.text||""));ul.append(li)}
      card.append(ul)}

  for(const f of document.querySelectorAll(".add")){if(keep[f.dataset.id]){const i=f.querySelector("input");i.value=keep[f.dataset.id];if(f.dataset.id===activeId)i.focus()}}
  const last=cars.reduce((m,c)=>(c.updated_at||"")>m?c.updated_at:m,"");
  $("foot").textContent=last?"最後更新："+fmt(last):"";
  window.scrollTo(0,sy);g.style.minHeight="";requestAnimationFrame(()=>window.scrollTo(0,sy));
}
async function load(){
  if(busy)return;
  try{
    const [a,b]=await Promise.all([
      fetch(SB+"/cars?select=*",{headers:H,cache:"no-store"}),
      fetch(SB+"/car_log?select=*&order=at.desc&limit=400",{headers:H,cache:"no-store"})]);
    if(!a.ok||!b.ok)throw 0;
    const ca=await a.json(),lb=await b.json(),sig=JSON.stringify([ca,lb]);
    if(sig===lastSig)return;lastSig=sig;
    cars=ca;logs={};for(const l of lb)(logs[l.car_id]=logs[l.car_id]||[]).push(l);
    render();
  }catch(e){$("foot").textContent="讀取失敗，請稍後重試"}
}
/* clicks */
$("grid").addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");
  if(t){const a=t.dataset.a;
    if(a==="lb"){openLb(t.dataset.src,t.dataset.cap);return}
    if(a==="av"){if(!needMe())return;target=t.dataset.id;$("avIn").value="";$("avIn").click();return}
    if(a==="cam"){if(!needMe())return;target=t.dataset.id;$("phIn").value="";$("phIn").click();return}
    const id=t.closest(".confirm").dataset.id;
    if(a==="no"){delete pend[id];render();return}
    if(a==="ok"){
      const me=needMe();if(!me||sending)return;
      const P=pend[id];if(!P)return;
      sending=true;busy=true;t.disabled=true;t.textContent="送出中…";
      try{
        const r=await fetch(SB+"/cars?id=eq."+encodeURIComponent(id)+"&select=*",{headers:H,cache:"no-store"});
        const c=(await r.json())[0];if(!c)throw 0;
        const body={updated_at:new Date().toISOString()},texts=[];let photoUrl=null;
        if(P.steps&&Object.keys(P.steps).length){body.steps={...c.steps,...P.steps};
          for(const[k,v]of Object.entries(P.steps))texts.push(STEPS.find(x=>x[0]===k)[1]+" "+LBL[v])}
        if(P.avatar){body.photo=await upload(P.avatar);texts.push("更新頭貼")}
        if(P.photo)photoUrl=await upload(P.photo);
        if(P.note||photoUrl){const line="["+fmt(new Date())+" "+me+"] "+(P.note||"拍照回報")+(photoUrl?"（附照片）":"");
          body.note=c.note?c.note+"\n"+line:line;texts.push((P.note?"備註："+P.note:"拍照回報")+(photoUrl?"（附照片）":""))}
        const p=await fetch(SB+"/cars?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:H,body:JSON.stringify(body)});
        if(!p.ok)throw 0;
        await fetch(SB+"/car_log",{method:"POST",headers:H,body:JSON.stringify({car_id:id,who:me,src:"web",text:texts.join("、"),photo:photoUrl})});
        delete pend[id];
      }catch(err){$("foot").textContent="更新失敗，請再按一次確認"}
      sending=false;busy=false;await load();render();return}
    return}
  const b=e.target.closest(".st");if(!b)return;
  if(!needMe())return;
  const id=b.dataset.id,k=b.dataset.k,c=cars.find(x=>x.id===id);if(!c)return;
  const P=pend[id]=pend[id]||{steps:{}};P.steps=P.steps||{};
  const cur=(c.steps||{})[k]||0,base=k in P.steps?P.steps[k]:cur,nv=(base+1)%3;
  if(nv===cur)delete P.steps[k];else P.steps[k]=nv;
  cleanPend(id);render();
});
function cleanPend(id){const P=pend[id];if(P&&!Object.keys(P.steps||{}).length&&!P.note&&!P.photo&&!P.avatar)delete pend[id]}
$("grid").addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.closest(".add");if(!f)return;
  const inp=f.querySelector("input"),txt=inp.value.trim();
  if(!needMe()||!txt)return;
  const P=pend[f.dataset.id]=pend[f.dataset.id]||{steps:{}};
  P.note=P.note?P.note+"；"+txt:txt;inp.value="";render();
});
async function stage(inp,key){
  const f=inp.files&&inp.files[0];if(!f||!target)return;
  try{const p=await compress(f);const P=pend[target]=pend[target]||{steps:{}};P[key]=p;render()}catch(e){$("foot").textContent="這張照片無法使用，請換一張"}
}
$("avIn").addEventListener("change",()=>stage($("avIn"),"avatar"));
$("phIn").addEventListener("change",()=>stage($("phIn"),"photo"));
/* add car */
$("addbtn").addEventListener("click",()=>{if(!needMe())return;$("newbox").hidden=!$("newbox").hidden;if(!$("newbox").hidden)$("nname").focus()});
$("npick").addEventListener("click",()=>{$("nIn").value="";$("nIn").click()});
$("nIn").addEventListener("change",async()=>{const f=$("nIn").files[0];if(!f)return;try{newPhoto=await compress(f);$("npv").src=newPhoto.url;$("npv").hidden=false}catch(e){$("nhint").textContent="這張照片無法使用，請換一張"}});
$("ncancel").addEventListener("click",()=>{$("newbox").hidden=true;$("nname").value="";newPhoto=null;$("npv").hidden=true});
$("nok").addEventListener("click",async()=>{
  const me=needMe(),name=$("nname").value.trim();if(!me||!name||sending){if(!name)$("nname").focus();return}
  sending=true;busy=true;$("nok").disabled=true;$("nok").textContent="新增中…";
  try{
    const id="c"+Date.now().toString(36);const url=newPhoto?await upload(newPhoto):null;
    const r=await fetch(SB+"/cars",{method:"POST",headers:H,body:JSON.stringify({id,name,photo:url,updated_at:new Date().toISOString()})});
    if(!r.ok)throw 0;
    await fetch(SB+"/car_log",{method:"POST",headers:H,body:JSON.stringify({car_id:id,who:me,src:"web",text:"新增車輛",photo:url})});
    $("newbox").hidden=true;$("nname").value="";newPhoto=null;$("npv").hidden=true;
  }catch(err){$("foot").textContent="新增失敗，請再試一次"}
  sending=false;busy=false;$("nok").disabled=false;$("nok").textContent="確認新增";await load();
});
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));render()});
load();setInterval(load,8000);
</script>
<script>
document.getElementById("ofilters").parentNode.addEventListener("click",e=>{const b=e.target.closest("#ofilters button,#bfilters button,#sfilters button");if(!b||!b.dataset.v)return;const v=b.dataset.v;
  if(b.dataset.k==="o"){ofil=v;bfil="全部"}else if(b.dataset.k==="b")bfil=v;else sfil=v;render()});
</script>
